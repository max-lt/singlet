[package]
name = "singlet-core"
version = "0.1.0"
description = "One instance per key, with its own SQLite storage"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["actor", "durable-objects", "sqlite", "tokio"]
categories = ["asynchronous", "concurrency", "database"]

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
rusqlite = "0.41.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
